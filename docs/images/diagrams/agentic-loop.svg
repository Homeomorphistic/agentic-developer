<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">The agentic loop</title>
  <desc id="desc">A goal enters the model. The model chooses the next action, a tool executes it, and the result is added to the context for the next model call. The cycle repeats until the model returns a completed result.</desc>
  <defs>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #172033; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 20px; fill: #52617a; }
      .model { fill: #eeeaff; stroke: #7564c8; stroke-width: 4; }
      .tool { fill: #e5f6ef; stroke: #23835c; stroke-width: 4; }
      .context { fill: #eaf2ff; stroke: #3467b9; stroke-width: 4; }
      .result { fill: #fff3d9; stroke: #c77c12; stroke-width: 4; }
      .arrow { fill: none; stroke: #46546a; stroke-width: 4; marker-end: url(#arrowhead); }
      .loop { fill: none; stroke: #3467b9; stroke-width: 5; marker-end: url(#loophead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#46546a"/>
    </marker>
    <marker id="loophead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3467b9"/>
    </marker>
  </defs>

  <text x="55" y="264" class="label heading">Goal</text>
  <path d="M145 255 H245" class="arrow"/>

  <rect x="255" y="170" width="340" height="170" rx="20" class="model"/>
  <text x="425" y="235" text-anchor="middle" class="label heading">Model</text>
  <text x="425" y="282" text-anchor="middle" class="label body">chooses the</text>
  <text x="425" y="315" text-anchor="middle" class="label body">next action</text>

  <path d="M595 255 H695" class="arrow"/>
  <text x="645" y="230" text-anchor="middle" class="label small">tool call</text>

  <rect x="705" y="170" width="340" height="170" rx="20" class="tool"/>
  <text x="875" y="235" text-anchor="middle" class="label heading">Tool</text>
  <text x="875" y="282" text-anchor="middle" class="label body">performs an</text>
  <text x="875" y="315" text-anchor="middle" class="label body">action</text>

  <path d="M1045 255 H1145" class="arrow"/>
  <text x="1095" y="230" text-anchor="middle" class="label small">output</text>

  <rect x="1155" y="170" width="390" height="170" rx="20" class="context"/>
  <text x="1350" y="235" text-anchor="middle" class="label heading">Context</text>
  <text x="1350" y="282" text-anchor="middle" class="label body">records the</text>
  <text x="1350" y="315" text-anchor="middle" class="label body">result</text>

  <path d="M1350 340 V455 Q1350 515 1290 515 H485 Q425 515 425 455 V350" class="loop"/>
  <text x="875" y="555" text-anchor="middle" class="label body">result becomes input to the next model call</text>

  <path d="M425 170 V95 H1155" class="arrow"/>
  <rect x="1165" y="45" width="380" height="100" rx="18" class="result"/>
  <text x="1355" y="85" text-anchor="middle" class="label small">when the goal is complete</text>
  <text x="1355" y="120" text-anchor="middle" class="label heading">Result</text>
</svg>
