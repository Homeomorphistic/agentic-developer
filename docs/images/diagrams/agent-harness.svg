<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">An agent harness in a development environment</title>
  <desc id="desc">A goal is passed to a harness, which manages the agent loop, context, permissions, and session state while coordinating an LLM and developer tools.</desc>
  <defs>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #172033; }
      .heading { font-size: 28px; font-weight: 700; letter-spacing: 1.4px; }
      .body { font-size: 24px; }
      .small { font-size: 20px; }
      .box { fill: #ffffff; stroke: #52617a; stroke-width: 3; }
      .harness { fill: #eaf2ff; stroke: #3467b9; stroke-width: 4; }
      .llm { fill: #eeeaff; stroke: #7564c8; stroke-width: 4; }
      .tools { fill: #e5f6ef; stroke: #23835c; stroke-width: 4; }
      .arrow { fill: none; stroke: #46546a; stroke-width: 4; marker-end: url(#arrowhead); }
      .exchange { marker-start: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#46546a"/>
    </marker>
  </defs>

  <rect x="45" y="70" width="1510" height="760" rx="24" fill="#f8fafc" stroke="#34435b" stroke-width="4"/>
  <text x="800" y="45" text-anchor="middle" class="label heading">DEVELOPMENT ENVIRONMENT</text>

  <text x="115" y="325" class="label body">Goal / prompt</text>
  <path d="M275 315 H475" class="arrow"/>

  <rect x="480" y="175" width="920" height="270" rx="20" class="harness"/>
  <text x="530" y="230" class="label heading">Harness</text>
  <line x1="530" y1="250" x2="1350" y2="250" stroke="#9bb9e7" stroke-width="2"/>
  <text x="530" y="300" class="label body">agent loop</text>
  <text x="530" y="345" class="label body">system prompt</text>
  <text x="530" y="390" class="label body">tool dispatcher</text>
  <text x="940" y="300" class="label body">context manager</text>
  <text x="940" y="345" class="label body">permissions</text>
  <text x="940" y="390" class="label body">session state</text>

  <path d="M765 455 V530" class="arrow exchange"/>
  <path d="M1130 455 V530" class="arrow exchange"/>

  <rect x="555" y="540" width="420" height="190" rx="18" class="llm"/>
  <text x="765" y="600" text-anchor="middle" class="label heading">LLM</text>
  <text x="765" y="645" text-anchor="middle" class="label body">reasoning +</text>
  <text x="765" y="680" text-anchor="middle" class="label body">generation</text>

  <rect x="1010" y="540" width="390" height="190" rx="18" class="tools"/>
  <text x="1205" y="600" text-anchor="middle" class="label heading">Tools</text>
  <text x="1205" y="645" text-anchor="middle" class="label body">files, shell, tests,</text>
  <text x="1205" y="680" text-anchor="middle" class="label body">browser, MCP, Git…</text>

  <text x="800" y="780" text-anchor="middle" class="label body">tests / compiler / linter / CI / review</text>
</svg>
